[project]
name = "mcp-tools"
version = "0.1.0"
description = "MCP tools for GitHub issue translation prompts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click",
    "mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
github-translate = "main:cli"
